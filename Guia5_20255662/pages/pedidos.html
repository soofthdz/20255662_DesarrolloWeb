<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de pedidos - Cafetería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/pedido.css">
    <script src="../js/pedidos.js" defer></script>
</head>
<body>
    <header class="encabezado text-white py-4 mb-4">
        <div class="container">
            <h1>Gestión de pedidos - Cafetería Mantra</h1>
            <p class="mb-0">Registro de pedidos de Mantra</p>
        </div>
    </header>

    <main class="container pb-4">
        <section class="card mb-4">
            <div class="card-body">
                <h2 class="h4 mb-3">Agregar pedido</h2>
                <form id="formularioPedido">
                    <div class="row g-3">
                        <div class="col-md-5">
                            <label for="producto" class="form-label">
                                Nombre del producto
                            </label>
                            <input type="text" id="producto"
                                   class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label for="precio" class="form-label">
                                Precio unitario ($)
                            </label>
                            <input type="number" id="precio"
                                   class="form-control" min="0.01"
                                   step="0.01" required>
                        </div>
                        <div class="col-md-2">
                            <label for="cantidad" class="form-label">
                                Cantidad
                            </label>
                            <input type="number" id="cantidad"
                                   class="form-control" min="1"
                                   step="1" required>
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button type="submit"
                                    class="btn boton-cafeteria w-100">
                                Agregar
                            </button>
                        </div>
                    </div>
                </form>
                <p id="mensaje" class="mt-3 mb-0"></p>
            </div>
        </section>

        <section class="card mb-4">
            <div class="card-body">
                <h2 class="h4 mb-3">Filtrar pedidos por precio</h2>

                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label for="precioMaximo" class="form-label">
                            Precio máximo ($)
                        </label>
                        <input type="number" id="precioMaximo"
                               class="form-control" min="0"
                               step="0.01" placeholder="Ej. 5.00">
                    </div>
                    <div class="col-md-4">
                        <button type="button" id="filtrarPedidos"
                                class="btn btn-secondary w-100">
                            Filtrar productos
                        </button>
                    </div>
                    <div class="col-md-4">
                        <button type="button" id="mostrarTodos"
                                class="btn btn-outline-secondary w-100">
                            Mostrar todos
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section class="card mb-4">
            <div class="card-body">
                <h2 class="h4 mb-3">Pedidos registrados</h2>
                <div id="tablaPedidos"></div>
                <div class="resumen p-3 mt-3">
                    <p class="mb-1">
                        Total de unidades:
                        <strong id="totalUnidades">0</strong>
                    </p>
                    <p class="mb-0">
                        Monto total de los pedidos:
                        <strong id="montoTotal">$0.00</strong>
                    </p>
                </div>
                <button type="button" id="limpiarPedidos"
                        class="btn btn-danger mt-3">
                    Limpiar pedidos
                </button>
            </div>
        </section>
    </main>
</body>
</html>
